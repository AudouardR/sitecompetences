{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Échanges de compétences{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="canonical" href="https://getbootstrap.com/docs/4.0/examples/sticky-footer-navbar/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'abilities/style.css' %}">
</head>

<body>
    <header>
        <nav class="navbar navbar-dark fixed-top bg-dark">
            <div>
                <img src="{% static 'abilities/images/logo.png' %}" width="50" height="50" alt="logo"/>
            </div>
            <div>
            {% if user.is_authenticated %}
                <a class="btn btn-secondary m-1" href="{% url 'profile_view' user.username %}">Profil</a>
                <form class="d-inline mx-1" action="{% url 'logout' %}" method="post">
                  {% csrf_token %}
                  <button class="btn btn-secondary" type="submit">Se déconnecter</button>
                </form>
            {% else %}
                <a class="btn btn-secondary m-1" href="{% url 'signup' %}">S'inscrire</a>
                <a class="btn btn-secondary m-1" href="{% url 'login' %}">Se connecter</a>
            {% endif %}
            </div>
        </nav>
    </header>
    <main role="main" class="container">
        {% block main %}
        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
