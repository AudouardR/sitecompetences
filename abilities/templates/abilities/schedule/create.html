{% extends "base.html" %}

{% block title %}Échanges de compétences - Proposer un créneau{% endblock %}

{% block main %}
<h1 class="mt-5">Proposer un créneau</h1>

<form action="{% url 'save_schedule' %}" method="post">
    {% csrf_token %}
    {{ form }}
    <button class="btn btn-primary m-1" type="submit">Proposer</button>
</form>
<a class="btn btn-secondary m-1" href="javascript:history.back()">Retour</a>

{% endblock %}
