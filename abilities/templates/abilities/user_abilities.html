{% extends "base.html" %}

{% block title %}
Échanges de compétences - Profil : {{ profile }}
{% endblock %}

{% block main %}
<h1 class="mt-5">Compétences de {{ profile }}</h1>
<form action="{% url 'confirm_abilities' profile.user.username %}" method="post">
    {% csrf_token %}
    {{ form }}
    <button class="btn btn-primary m-1" type="submit">Enregistrer</button>
</form>
<a class="btn btn-secondary m-1" href="javascript:history.back()">Retour</a>
{% endblock %}
