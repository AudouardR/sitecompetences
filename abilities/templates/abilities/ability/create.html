{% extends "base.html" %}

{% block title %}Échanges de compétences - Ajouter une compétence{% endblock %}

{% block main %}
<h1 class="mt-5">Ajouter une compétence</h1>

<form action="{% url 'save_ability' %}" method="post">
    {% csrf_token %}
    {{ form }}
    <button class="btn btn-primary m-1" type="submit">Créer</button>
</form>
<a class="btn btn-secondary m-1" href="javascript:history.back()">Retour</a>

{% endblock %}
