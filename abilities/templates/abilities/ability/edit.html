{% extends "base.html" %}

{% block title %}Échanges de compétences - Modifier une compétence{% endblock %}

{% block main %}
<h1 class="mt-5">Modifier une compétence</h1>

<form action="{% url 'update_ability' ability.id %}" method="post">
    {% csrf_token %}
    {{ form }}
    <button class="btn btn-primary m-1" type="submit">Enregistrer</button>
</form>
<a class="btn btn-secondary m-1" href="javascript:history.back()">Retour</a>

{% endblock %}
